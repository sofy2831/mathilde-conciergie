<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Connexion administrateur — CleanUp Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --brown:#3E2D25;
      --brown-2:#5A4033;
      --sand:#E9DDCF;
      --beige:#F5EFE7;
      --cream:#FCFAF7;
      --terracotta:#B96F52;
      --sage:#7E927C;
      --sage-soft:#E7EEE5;
      --text:#2F2926;
      --muted:#766C66;
      --line:#E4D9CF;
      --danger:#A43C32;
      --success:#4F7351;
      --shadow:0 22px 60px rgba(62,45,37,.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--text);
      background:
        radial-gradient(circle at 5% 0%,rgba(233,221,207,.9),transparent 28%),
        radial-gradient(circle at 100% 12%,rgba(245,228,220,.95),transparent 30%),
        #F7F3EE;
    }
    .card{
      width:min(100%,470px);background:rgba(255,255,255,.96);border:1px solid var(--line);
      border-radius:24px;padding:34px;box-shadow:var(--shadow)
    }
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
    .brand-mark{
      width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--brown),var(--brown-2));
      color:white;display:grid;place-items:center;font-size:22px;font-weight:900
    }
    .brand-text strong{display:block;font-size:22px;line-height:.95;color:var(--brown);font-weight:900;letter-spacing:-.04em}
    .brand-text span{display:block;font-size:8px;letter-spacing:.3em;text-transform:uppercase;color:var(--terracotta);margin-top:5px;font-weight:900}
    h1{font-family:"DM Serif Display",serif;font-size:36px;line-height:1.02;font-weight:400;margin:0 0 10px;color:var(--brown)}
    .intro{margin:0 0 26px;color:var(--muted);line-height:1.65;font-size:14px}
    label{display:block;margin:16px 0 7px;font-size:13px;font-weight:800;color:var(--brown)}
    input{
      width:100%;height:50px;border:1px solid #D7CCC2;border-radius:13px;padding:0 14px;
      font:inherit;background:#fff;outline:none
    }
    input:focus{border-color:var(--terracotta);box-shadow:0 0 0 3px rgba(185,111,82,.12)}
    button{
      width:100%;height:51px;margin-top:22px;border:0;border-radius:999px;
      background:linear-gradient(135deg,var(--brown),var(--brown-2));color:white;
      font:inherit;font-weight:800;cursor:pointer
    }
    button:disabled{opacity:.6;cursor:wait}
    .message{display:none;margin-top:16px;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.5}
    .message.error{display:block;background:#FFF0ED;border:1px solid #F0C5BC;color:var(--danger)}
    .message.success{display:block;background:var(--sage-soft);border:1px solid #C9D9C6;color:var(--success)}
    .back{display:block;text-align:center;margin-top:20px;color:var(--brown);font-size:13px;text-decoration:none;font-weight:700}
    .security{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:11px;line-height:1.55;color:var(--muted)}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="brand-mark">⌂</div>
      <div class="brand-text"><strong>CleanUp</strong><span>Manager</span></div>
    </div>

    <h1>Connexion administrateur</h1>
    <p class="intro">Accès réservé au compte administrateur CleanUp Manager.</p>

    <form id="loginForm">
      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button id="submitBtn" type="submit">Se connecter</button>
      <div id="message" class="message" role="alert"></div>
    </form>

    <a class="back" href="les-indispensables-du-proprietaire.html">Retour aux Indispensables</a>
    <div class="security">L’accès est accordé uniquement après vérification du compte Firebase et du rôle administrateur.</div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const firebaseConfig = {
  apiKey: "AIzaSyAhAPxM-RBJOSSXBPwkXiEu6GPKk0S6GfE",
  authDomain: "cleanup-diagnostic.firebaseapp.com",
  projectId: "cleanup-diagnostic",
  storageBucket: "cleanup-diagnostic.firebasestorage.app",
  messagingSenderId: "6668236990",
  appId: "1:6668236990:web:d1304e6113d974a04c46ef"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    function friendlyError(error) {
      const code = error?.code || "";
      if (code.includes("invalid-credential") || code.includes("wrong-password") || code.includes("user-not-found")) {
        return "Adresse e-mail ou mot de passe incorrect.";
      }
      if (code.includes("too-many-requests")) return "Trop de tentatives. Réessaie dans quelques minutes.";
      if (code.includes("network-request-failed")) return "Connexion à Firebase impossible.";
      return error?.message || "Connexion impossible.";
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      try {
        const token = await user.getIdTokenResult(true);
        if (token.claims.admin === true) {
          window.location.replace("admin-cleanup.html");
        }
      } catch (error) {
        console.error(error);
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.className = "message";
      submitBtn.disabled = true;
      submitBtn.textContent = "Vérification…";

      try {
        const credential = await signInWithEmailAndPassword(
          auth,
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );

        const token = await credential.user.getIdTokenResult(true);

        if (token.claims.admin !== true) {
          await signOut(auth);
          throw new Error("Ce compte ne possède pas le rôle administrateur.");
        }

        showMessage("Connexion réussie. Redirection…", "success");
        window.location.replace("admin-cleanup.html");
      } catch (error) {
        showMessage(friendlyError(error));
        submitBtn.disabled = false;
        submitBtn.textContent = "Se connecter";
      }
    });
  </script>
</body>
</html>
