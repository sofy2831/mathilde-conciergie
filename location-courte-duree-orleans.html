<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Location courte durée à Orléans | Conciergerie Les Clés de Mathilde</title>
  <meta
    name="description"
    content="Gestion de location courte durée à Orléans, La Ferté-Saint-Aubin et alentours : accueil, ménage, linge, coordination et suivi avec Les Clés de Mathilde."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --text:#1d1d1f;
      --muted:#5f6368;
      --shadow:0 10px 30px rgba(0,0,0,.08);
      --primary:#24354a;
      --primary-dark:#182536;
      --green:#7ab33b;
      --green-dark:#5d8f2a;
      --blue:#627894;
      --blue-dark:#485d76;
    }

    *{ box-sizing:border-box; margin:0; padding:0; }
    body{
      font-family:"Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:var(--text);
      background:
        linear-gradient(rgba(247,243,238,.92), rgba(247,243,238,.96)),
        url('https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=1600&q=80') center/cover fixed;
      line-height:1.6;
      min-height:100vh;
    }

    a{ color:inherit; text-decoration:none; }

    .container{ width:min(1120px, calc(100% - 32px)); margin:0 auto; }

    .topbar{ padding:18px 0 0; }

    .back-link{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 16px; border-radius:999px; background:#fff;
      border:1px solid rgba(0,0,0,.08); box-shadow:var(--shadow);
      font-weight:700; color:#24354a;
    }

    .hero{ padding:34px 0 24px; text-align:center; }

    .eyebrow{
      display:inline-flex; align-items:center; gap:10px;
      background:rgba(255,255,255,.9); color:#334;
      padding:10px 18px; border-radius:999px;
      font-size:14px; font-weight:700;
      box-shadow:var(--shadow); margin-bottom:24px;
      border:1px solid rgba(0,0,0,.06);
    }

    h1{
      font-family:"Playfair Display", serif;
      font-size:clamp(38px, 6vw, 70px);
      font-weight:600;
      line-height:1.08;
      margin-bottom:16px;
    }

    .subtitle{
      max-width:900px; margin:0 auto;
      font-size:clamp(21px, 2.5vw, 34px);
      line-height:1.35; color:#2b2b2d;
    }

    .hero-text{
      max-width:860px; margin:18px auto 0;
      font-size:18px; color:#4f5358;
    }

    .buttons{
      display:flex; flex-wrap:wrap; justify-content:center;
      gap:14px; margin:30px 0 16px;
    }

    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      min-height:54px; padding:0 24px; border-radius:14px;
      font-size:17px; font-weight:800; border:2px solid #d8d8d8;
      background:#fff; box-shadow:0 4px 12px rgba(0,0,0,.05);
      transition:.2s ease; text-align:center;
    }

    .btn:hover{ transform:translateY(-1px); }

    .btn.primary{
      background:linear-gradient(180deg, var(--primary), var(--primary-dark));
      color:#fff; border-color:transparent;
    }

    .btn.secondary{
      color:#2c2c2d; background:#fbfbfb;
    }

    .section{ padding-top:24px; }

    .section-box{
      background:rgba(255,255,255,.88);
      border:1px solid #ddd6cf;
      border-radius:24px;
      padding:34px 28px;
      box-shadow:var(--shadow);
      margin:28px 0;
    }

    .section-box h2{
      font-size:34px; margin-bottom:14px; line-height:1.15;
    }

    .section-lead{
      font-size:18px; color:var(--muted); max-width:860px;
    }

    .grid-2{
      display:grid; grid-template-columns:repeat(2, 1fr);
      gap:18px; margin-top:22px;
    }

    .info-card{
      background:#fff; border:1px solid #ece7e1;
      border-radius:18px; padding:22px;
    }

    .info-card h3{
      font-size:22px; margin-bottom:10px;
    }

    .info-card p, .info-card li{
      color:var(--muted); font-size:16px;
    }

    .info-card ul{ margin-top:10px; padding-left:18px; }
    .info-card li + li{ margin-top:8px; }

    .banner{
      margin:18px 0;
      text-align:center; color:#fff;
      border-radius:24px; padding:30px 22px 26px;
      box-shadow:var(--shadow);
      background:linear-gradient(180deg, var(--green), var(--green-dark));
    }

    .banner h2{
      font-size:34px; line-height:1.2; margin-bottom:8px; font-weight:800;
    }

    .banner p{ font-size:20px; opacity:.98; }

    .cta-box{
      text-align:center; padding:10px 0 44px;
    }

    .cta-title{
      font-family:"Playfair Display", serif;
      font-size:48px; margin-bottom:18px; line-height:1.1;
    }

    .cta-text{
      max-width:780px; margin:0 auto 24px;
      font-size:23px; color:#35363a;
    }

    .links-box{
      display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:20px;
    }

    .mini-link{
      padding:10px 16px; border-radius:999px;
      background:#fff; border:1px solid rgba(0,0,0,.08);
      box-shadow:0 4px 12px rgba(0,0,0,.04);
      font-weight:700; color:#24354a;
    }

    .cta-sub{
      margin-top:16px; font-size:16px; color:#666; font-weight:700;
    }

    .whatsapp-float{
      position:fixed; bottom:20px; right:20px;
      width:60px; height:60px; border-radius:50%;
      background:#25D366; color:#fff; font-size:28px;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 6px 20px rgba(0,0,0,.2); z-index:999;
    }

    footer{
      text-align:center; color:#666; font-size:14px; padding:12px 0 36px;
    }

    @media (max-width:820px){ .grid-2{ grid-template-columns:1fr; } }

    @media (max-width:720px){
      .container{ width:min(100% - 20px, 1120px); }
      .buttons{ flex-direction:column; align-items:stretch; }
      .btn{ width:100%; }
      .section-box{ padding:24px 18px; }
      .section-box
